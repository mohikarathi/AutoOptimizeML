[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autoopt"
version = "1.0.0"
description = "AutoOptimizeML: Hardware-Agnostic ML/DL Optimization and Deployment Platform"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "AutoOptimizeML Team" }]
dependencies = [
    "click>=8.0.0",
    "numpy>=1.20.0",
    "psutil>=5.8.0",
    "pydantic>=2.0.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.20.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.8.0",
]

[project.scripts]
autoopt = "autoopt.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autoopt*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

